name: Deploy to cPanel via FTP (Windows)

on:
  push:
    branches:
      - main  # Runs on push to the master branch

jobs:
  deploy:
    runs-on: windows-latest  # Runs on a Windows machine

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: "/home/eduvess.com/test/"  # Change to your cPanel directory if needed
        protocol: "ftp"
        port: ${{ secrets.FTP_PORT }}
        timeout: 300  # Increase timeout if needed
