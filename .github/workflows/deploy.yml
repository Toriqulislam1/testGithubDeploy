name: Deploy to cPanel via FTP (Windows)

on:
  push:
    branches:
      - main  # Trigger this workflow on push to the "main" branch

jobs:
  deploy:
    runs-on: windows-latest  # Runs on a Windows machine

    steps:
    # Step 1: Checkout the repository to get the latest code
    - name: Checkout Repository
      uses: actions/checkout@v3  # Use actions/checkout to check out your code

    # Step 2: Deploy the files to the cPanel FTP server
    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4  # Use the correct version of the FTP deployment action
      with:
        server: ${{ secrets.FTP_SERVER }}         # FTP server address (e.g., ftp.yoursite.com)
        username: ${{ secrets.FTP_USERNAME }}     # FTP username
        password: ${{ secrets.FTP_PASSWORD }}     # FTP password
        port: ${{ secrets.FTP_PORT }}             # FTP port (usually 21)
        server-dir: "/home/eduvess.com/test/"     # Target directory on the FTP server
        protocol: "ftp"                           # Protocol to use (FTP)
        timeout: 300                              # Optional: Set timeout if needed
        local-dir: "./"                           # Local directory to upload (usually root of the repo)
        dry-run: false                            # Set to true if you want to test without uploading files
