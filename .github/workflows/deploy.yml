name: Deploy to cPanel via FTP (Windows)

on:
  push:
    branches:
      - main  # Change this to your main branch if needed

jobs:
  deploy:
    runs-on: windows-latest  # Runs on a Windows machine

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3  # Checkout your repository

    - name: Deploy to cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v1  # Use the latest available version v1
      with:
        server: ${{ secrets.FTP_SERVER }}        # Your FTP server address
        username: ${{ secrets.FTP_USERNAME }}    # Your FTP username
        password: ${{ secrets.FTP_PASSWORD }}    # Your FTP password
        server-dir: "/home/eduvess.com/test/"    # Your cPanel directory
        protocol: "ftp"                          # Use FTP protocol
        port: ${{ secrets.FTP_PORT }}            # FTP port
        timeout: 300                             # Optional: Set timeout if needed
